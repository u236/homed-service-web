<div class="title">
    <span class="name"></span>
</div>
<form>
    <label>Property name:</label>
    <input type="text" name="name">
</form>
<label>Property icon:</label>
<div class="table">
    <table class="select">
        <tr>
            <td class="icon"></td>
            <td class="restore"><i class="mdi-close"></i></td>
            <td class="dropdown"><i class="mdi-menu"></i></td>
        </tr>
    </table>
</div>
<div class="buttons">
    <button class="save"><i class="mdi-check-circle"></i> Save</button>
    <button class="cancel"><i class="mdi-close-circle"></i> Cancel</button>
</div>
