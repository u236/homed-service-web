<div class="title">
    <span class="name"></span>
    <span class="dataLoader"></span>
</div>
<div class="battery title">
    <span class="shade"><i class="mdi-battery warning"></i> <i>It may be necessary to wake up the battery-powered device for each OTA operation.</i></span>
</div>
<div class="table overflow">
    <table>
        <tr><td>Manufacturer code</td><td class="otaData manufacturerCode"></td></tr>
        <tr><td>Image type</td><td class="otaData imageType"></td></tr>
        <tr><td>Current version</td><td class="otaData currentVersion"></td></tr>
        <tr><td>File version</td><td class="otaData fileVersion"></td></tr>
        <tr><td>File name</td><td class="otaData fileName"></td></tr>
        <tr><td>Progress</td><td class="otaData progress"></td></tr>
    </table>
</div>
<div class="buttons">
    <button class="refresh"><i class="mdi-sync"></i> Refresh</button>
    <button class="upgrade"><i class="mdi-tray-arrow-down"></i> Upgrade</button>
    <button class="close"><i class="mdi-close-circle"></i> Close</button>
</div>
