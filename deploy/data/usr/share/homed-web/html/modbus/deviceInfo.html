<div class="deviceInfo">
    <div class="title">
        <span class="name"></span>
        <div class="buttons">
            <button class="edit"><i class="mdi-pencil"></i><span class="mobileHidden"> Edit</span></button>
            <button class="remove"><i class="mdi-trash-can-outline"></i><span class="mobileHidden"> Remove</span></button>
            <button class="previous mobileHidden" title="Previous"><i class="mdi-arrow-left"></i></button>
            <button class="next mobileHidden" title="Next"><i class="mdi-arrow-right"></i></button>
        </div>
    </div>
    <div class="note"></div>
    <table class="summary">
        <tr><td>Type</td><td class="type"></td></tr>
        <tr><td>Port ID</td><td class="portId"></td></tr>
        <tr><td>Slave ID</td><td class="slaveId"></td></tr>
        <tr><td>Baud rate</td><td class="baudRate"></td></tr>
        <tr><td>Poll interval</td><td class="pollInterval"></td></tr>
        <tr><td>Request timeout</td><td class="requestTimeout"></td></tr>
        <tr><td>Reply timeout</td><td class="replyTimeout"></td></tr>
        <tr><td>Discovery</td><td class="discovery"></td></tr>
        <tr><td>Cloud</td><td class="cloud"></td></tr>
        <tr><td>Active</td><td class="active"></td></tr>
    </table>
    <div class="exposes title">
        <span class="name">Exposes</span>
    </div>
    <table class="exposes"></table>
</div>
