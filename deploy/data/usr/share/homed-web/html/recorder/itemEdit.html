<div class="title">

    <div class="table">
        <table class="select">
            <tr>
                <td class="property">Select property there <i class="mdi-arrow-right"></i></td>
                <td class="dropdown"><i class="mdi-menu"></i></div>

        </table>
    </div>

    <button class="save"><i class="mdi-check-circle"></i> Save</button>
    <button class="cancel"><i class="mdi-close-circle"></i> Cancel</button>
