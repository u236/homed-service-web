<div class="deviceInfo">
    <div class="title">
        <span class="name"></span>
        <div class="buttons">
            <button class="edit"><i class="mdi-pencil"></i><span class="mobileHidden"> Edit</span></button>
            <button class="remove"><i class="mdi-trash-can-outline"></i><span class="mobileHidden"> Remove</span></button>
            <button class="previous mobileHidden" title="Previous"><i class="mdi-arrow-left"></i></button>
            <button class="next mobileHidden" title="Next"><i class="mdi-arrow-right"></i></button>
        </div>
    </div>
    <table>
        <tr><td>Stream ID</td><td class="id"></td></tr>
        <tr><td>Main stream</td><td class="mainStream"></td></tr>
        <tr><td>Sub stream</td><td class="subStream"></td></tr>
    </table>
    <div class="cameraView"></div>
</div>
