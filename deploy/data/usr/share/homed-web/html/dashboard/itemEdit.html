<div class="title">
    <span class="name"></span>
</div>
<label>Item:</label>
<div class="table">
    <table class="select">
        <tr>
            <td class="item"></td>
            <td class="dropdown"><i class="mdi-menu"></i></td>
        </tr>
    </table>
</div>
<form>
    <label>Name:</label>
    <input type="text" name="name">
    <span class="shift" style="display: none;">
        <label>Shift:</label>
        <select name="shift"><option>none</option><option>1 hour</option><option>1 day</option><option>1 week</option><option>1 month</option><option>1 year</option></select>
    </span>
</form>
<div class="buttons">
    <button class="save"><i class="mdi-check-circle"></i> Save</button>
    <button class="cancel"><i class="mdi-close-circle"></i> Cancel</button>
</div>
