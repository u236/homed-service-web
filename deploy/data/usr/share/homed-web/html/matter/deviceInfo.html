<div class="deviceInfo">
    <div class="title">
        <span class="name"></span>
        <div class="buttons">
            <!-- <button class="share"><i class="mdi-chevron-right-circle"></i><span class="mobileHidden"> Share</span></button> -->
            <button class="edit"><i class="mdi-pencil"></i><span class="mobileHidden"> Edit</span></button>
            <button class="remove"><i class="mdi-trash-can-outline"></i><span class="mobileHidden"> Remove</span></button>
            <button class="previous mobileHidden" title="Previous"><i class="mdi-arrow-left"></i></button>
            <button class="next mobileHidden" title="Next"><i class="mdi-arrow-right"></i></button>
        </div>
    </div>
    <div class="note"></div>
    <table class="summary">
        <tr>
            <td>Node ID</td>
            <td class="nodeId"></td>
        </tr>
        <tr>
            <td>Manufacturer name</td>
            <td class="manufacturerName"></td>
        </tr>
        <tr>
            <td>Model name</td>
            <td class="modelName"></td>
        </tr>
        <tr>
            <td>Discovery</td>
            <td class="discovery"></td>
        </tr>
        <tr>
            <td>Cloud</td>
            <td class="cloud"></td>
        </tr>
        <tr>
            <td>Active</td>
            <td class="active"></td>
        </tr>
    </table>
    <div class="exposes title">
        <span class="name">Exposes</span>
    </div>
    <table class="exposes"></table>
</div>
