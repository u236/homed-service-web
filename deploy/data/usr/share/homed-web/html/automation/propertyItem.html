<div class="title">
    <span class="name"></span>
    <span class="copy"><i class="mdi-content-copy"></i></span>
</div>
<label>Property:</label>
<div class="table">
    <table class="select">
        <tr>
            <td class="property"></td>
            <td class="dropdown"><i class="mdi-menu"></i></td>
        </tr>
    </table>
</div>
<form>
    <label>Statement:</label>
    <select name="statement"></select>
    <span class="array" style="display: none;">
        <label>Min:</label>
        <input type="text" name="min" required>
        <label>Max:</label>
        <input type="text" name="max" required>
    </span>
    <span class="other">
        <label><span>Value:</span><span><i id="value" class="mdi-plus extend"></i><span id="value" class="dropdown"><i class="mdi-menu"></i></span></span></label>
        <textarea name="value" required></textarea>
    </span>
    <span class="hold">
        <label>Hold (seconds):</label>
        <input type="number" name="hold" min="0">
    </span>
    <span class="triggerName">
        <label><span>Trigger name:</span><span><i id="triggerName" class="mdi-plus extend"></i><span id="triggerName" class="dropdown"><i class="mdi-menu"></i></span></span></label>
        <textarea name="triggerName"></textarea>
    </span>
    <label class="checkbox"><input type="checkbox" name="force">Force</label>
    <label class="checkbox"><input type="checkbox" name="active">Active</label>
</form>
<div class="buttons">
    <button class="save"><i class="mdi-check-circle"></i> Save</button>
    <button class="cancel"><i class="mdi-close-circle"></i> Cancel</button>
</div>
