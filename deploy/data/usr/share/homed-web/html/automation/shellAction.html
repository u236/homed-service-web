<div class="title">
    <span class="name">Shell action</span>
    <span class="copy"><i class="mdi mdi-content-copy"></i></span>
</div>
<form>
    <label><span>Command:</span><span><i id="command" class="mdi mdi-plus extend"></i><span id="command" class="dropdown"><i class="mdi mdi-menu"></i></span></span></label>
    <textarea name="command"></textarea>
    <label>Timeout (seconds):</label>
    <input type="number" name="timeout" min="1">
    <label>Trigger name:</label>
    <input type="text" name="triggerName">
    <label class="checkbox"><input type="checkbox" name="active">Active</label>
</form>
<div class="buttons">
    <button class="save"><i class="mdi mdi-check-circle"></i> Save</button>
    <button class="cancel"><i class="mdi mdi-close-circle"></i> Cancel</button>
</div>
