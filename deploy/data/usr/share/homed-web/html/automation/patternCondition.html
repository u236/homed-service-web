<div class="title">
    <span class="name">Pattern condition</span>
    <span class="copy"><i class="mdi-content-copy"></i></span>
</div>
<form>
    <label><span>Pattern:</span><span><i id="pattern" class="mdi-plus extend"></i><span id="pattern" class="dropdown"><i class="mdi-menu"></i></span></span></label>
    <textarea name="pattern"></textarea>
    <label>Statement:</label>
    <select name="statement"></select>
    <span class="array" style="display: none;">
        <label>Min:</label>
        <input type="text" name="min">
        <label>Max:</label>
        <input type="text" name="max">
    </span>
    <span class="other">
        <label><span>Value:</span><span><i id="value" class="mdi-plus extend"></i><span id="value" class="dropdown"><i class="mdi-menu"></i></span></span></label>
        <textarea name="value"></textarea>
    </span>
    <label class="checkbox"><input type="checkbox" name="active">Active</label>
</form>
<div class="buttons">
    <button class="save"><i class="mdi-check-circle"></i> Save</button>
    <button class="cancel"><i class="mdi-close-circle"></i> Cancel</button>
</div>
