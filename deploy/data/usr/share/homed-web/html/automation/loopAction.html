<div class="title">
    <span class="name">Loop action</span>
    <span class="copy"><i class="mdi-content-copy"></i></span>
</div>
<form>
    <label><span>Count:</span><span><i id="count" class="mdi-plus extend"></i><span id="count" class="dropdown"><i class="mdi-menu"></i></span></span></label>
    <textarea name="count" required></textarea>
    <label>Condition type:</label>
    <select name="conditionType"><option>AND</option><option>OR</option><option>NOT</option></select>
    <label>Trigger name:</label>
    <input type="text" name="triggerName">
    <label class="checkbox"><input type="checkbox" name="hideWhile">Hide empty while</label>
    <label class="checkbox"><input type="checkbox" name="active">Active</label>
</form>
<div class="buttons">
    <button class="save"><i class="mdi-check-circle"></i> Save</button>
    <button class="cancel"><i class="mdi-close-circle"></i> Cancel</button>
</div>
