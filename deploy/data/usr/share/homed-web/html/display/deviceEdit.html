<div class="title">
    <span class="name"></span>
</div>
<form>
    <label>Name:</label>
    <input type="text" name="name">
    <label><span>Note:</span><span><i id="note" class="mdi-plus extend"></i></span></label>
    <textarea name="note"></textarea>
    <label>ID:</label>
    <input type="text" name="id">
    <label>Width (px):</label>
    <input type="number" name="width" min="1">
    <label>Height (px):</label>
    <input type="number" name="height" min="1">
    <label>Home page:</label>
    <input type="number" name="home" min="0" max="4">
    <label><span>Pages (JSON array):</span><span><i id="pages" class="mdi-plus extend"></i></span></label>
    <textarea name="pages"></textarea>
    <label class="checkbox"><input type="checkbox" name="discovery">Discovery</label>
    <label class="checkbox"><input type="checkbox" name="cloud">Cloud</label>
    <label class="checkbox"><input type="checkbox" name="active">Active</label>
</form>
<div class="buttons">
    <button class="save"><i class="mdi-check-circle"></i> Save</button>
    <button class="cancel"><i class="mdi-close-circle"></i> Cancel</button>
</div>
