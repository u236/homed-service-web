<div class="title">
    <span class="name"></span>
</div>
<form>
    <label>Name:</label>
    <input type="text" name="name" placeholder="Default name">
    <label><span>Note:</span><span><i id="note" class="mdi-plus extend"></i></span></label>
    <textarea name="note"></textarea>
    <label>Layout:</label>
    <select name="layout"><option>1x1</option><option>1x2</option><option>1x3</option><option>1x4</option><option>2x2</option><option>2x3</option><option>2x4</option><option>3x3</option><option>3x4</option></select>
    <label class="checkbox"><input type="checkbox" name="clock">Clock</label>
</form>
<div class="table overflow">
    <table class="items"></table>
</div>
<div class="buttons">
    <button class="add"><i class="mdi-plus"></i><span class="mobileHidden"> Add</span> Item</button>
    <button class="save"><i class="mdi-check-circle"></i> Save</button>
    <button class="cancel"><i class="mdi-close-circle"></i> Cancel</button>
</div>
