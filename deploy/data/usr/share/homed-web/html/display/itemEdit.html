<div class="title">
    <span class="name"></span>
</div>
<div class="itemData">
    <label>Item:</label>
    <div class="table">
        <table class="select">
            <tr>
                <td class="item"></td>
                <td class="dropdown"><i class="mdi-menu"></i></td>
            </tr>
        </table>
    </div>
</div>
<form>
    <label>Name:</label>
    <input type="text" name="name" placeholder="Default name">
</form>
<div class="iconData">
    <label>Icon:</label>
    <div class="table">
        <table class="select">
            <tr>
                <td class="icon"></td>
                <td class="restore"><i class="mdi-close"></i></td>
                <td class="dropdown"><i class="mdi-menu"></i></td>
            </tr>
        </table>
    </div>
</div>
<div class="buttons">
    <button class="save"><i class="mdi-check-circle"></i> Save</button>
    <button class="cancel"><i class="mdi-close-circle"></i> Cancel</button>
</div>
